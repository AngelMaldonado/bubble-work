# Lo mismo que corre antes de cada commit, corriendo también aquí.
#
# `scripts/check.sh` y no una lista de pasos de Actions: dos definiciones de "qué
# tiene que pasar" se separan, y la que se rompe siempre es la que nadie mira.
name: check

# Al abrir o actualizar un PR hacia main, y sólo ahí.
#
# No en cada push a una rama de trabajo: mientras se está construyendo algo, lo
# que dice si va bien es `just check` en la máquina de quien lo escribe — el hook
# de commit ya lo corre. Gastar cinco minutos de runner en cada empujón
# intermedio enseña a mirar para otro lado cuando sale rojo, que es justo lo que
# esta puerta no puede permitirse. El push a main tampoco lo necesita: el
# release corre `scripts/check.sh` antes de tagear nada.
on:
  pull_request:
    branches: [main]

# Una corrida a la vez en esa máquina. En un runner alojado cada trabajo es una
# VM nueva; en el nuestro comparten disco, y `scripts/test.sh` levanta el
# servidor en un puerto fijo (8099) sobre un directorio de datos fijo. Dos PR a
# la vez se pisarían y el fallo parecería del código.
concurrency:
  group: check-reko
  cancel-in-progress: false

jobs:
  check:
    # La Mac mini de reko, que está siempre encendida. Este repositorio es
    # PRIVADO, así que cada corrida en un runner alojado se paga, y ésta ya no
    # tenía nada que hacer desde que se fueron los workflows de despliegue de v0.
    #
    # reko y NO ayetec, que también tiene runner: `pull_request` ejecuta código
    # de la rama que se propone, y el agente de ayetec corre con sudo sin
    # contraseña en la máquina que sirve la instancia pública. Aquí el peor caso
    # se queda en una máquina de la LAN.
    #
    # El `release` se queda en ubuntu alojado a propósito: es el segundo par de
    # ojos en LINUX. La primera vez que corrió encontró cinco aserciones que en
    # macOS pasaban sin llegar nunca a la regla que decían comprobar. Un CI que
    # sólo mira desde el mismo sistema que la máquina de quien escribe no es un
    # segundo par de ojos.
    runs-on: [self-hosted, reko]
    steps:
      - uses: actions/checkout@v4
        with:
          # El historial entero: `scripts/build.sh` sella la versión con
          # `git describe`, y un clon superficial no tiene tags que describir.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # bun para el type-check de la interfaz. `check.sh` se lo salta si no está,
      # y saltárselo aquí sería no comprobarlo en ningún sitio.
      - uses: oven-sh/setup-bun@v2
      - run: cd frontend && bun install --frozen-lockfile

      - run: scripts/check.sh
