# Lo mismo que corre antes de cada commit, corriendo también aquí.
#
# `scripts/check.sh` y no una lista de pasos de Actions: dos definiciones de "qué
# tiene que pasar" se separan, y la que se rompe siempre es la que nadie mira.
name: check

# Al abrir o actualizar un PR hacia main, y sólo ahí.
#
# No en cada push a una rama de trabajo: mientras se está construyendo algo, lo
# que dice si va bien es `just check` en la máquina de quien lo escribe — el hook
# de commit ya lo corre. Gastar cinco minutos de runner en cada empujón
# intermedio enseña a mirar para otro lado cuando sale rojo, que es justo lo que
# esta puerta no puede permitirse. El push a main tampoco lo necesita: el
# release corre `scripts/check.sh` antes de tagear nada.
on:
  pull_request:
    branches: [main]

# Una corrida a la vez de ESTE repositorio, y el grupo es COMPARTIDO con
# `release`: los dos corren en la misma VM, y los grupos de concurrencia valen
# para todo el repositorio. En un runner alojado cada trabajo es una VM nueva;
# en el nuestro comparten disco, y la suite levanta un servidor sobre un
# directorio de datos. Dos a la vez se pisarían y el fallo parecería del código.
#
# Entre REPOSITORIOS la concurrencia de GitHub no cruza: eso lo resuelve
# `BUBBLE_TEST_PORT`, que le da a cada proyecto su puerto y su directorio.
concurrency:
  group: bubble-work-ci
  cancel-in-progress: false

jobs:
  check:
    # La VM de Linux dentro de reko (ver deploy/CI.md). Este repositorio es
    # PRIVADO, así que cada corrida en un runner alojado se paga.
    #
    # En una VM y no en el host macOS por dos razones: la suite corre con bash 5
    # y coreutils de GNU —el cruce de sistemas que encontró cinco aserciones que
    # en macOS pasaban sin llegar a la regla que decían comprobar— y el código
    # de un PR se ejecuta donde no se ve el disco de nadie y se puede resetear.
    #
    # Y NO en ayetec, que también tiene runner: ése corre con sudo sin
    # contraseña en la máquina que sirve la instancia pública, y `pull_request`
    # ejecuta código de la rama que se propone.
    runs-on: [self-hosted, reko-ci]
    steps:
      - uses: actions/checkout@v4
        with:
          # El historial entero: `scripts/build.sh` sella la versión con
          # `git describe`, y un clon superficial no tiene tags que describir.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # bun para el type-check de la interfaz. `check.sh` se lo salta si no está,
      # y saltárselo aquí sería no comprobarlo en ningún sitio.
      - uses: oven-sh/setup-bun@v2
      - run: cd frontend && bun install --frozen-lockfile

      - run: scripts/check.sh
