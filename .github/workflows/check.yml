# Lo mismo que corre antes de cada commit, corriendo también aquí.
#
# `scripts/check.sh` y no una lista de pasos de Actions: dos definiciones de "qué
# tiene que pasar" se separan, y la que se rompe siempre es la que nadie mira.
name: check

# Al abrir o actualizar un PR hacia main, y sólo ahí.
#
# No en cada push a una rama de trabajo: mientras se está construyendo algo, lo
# que dice si va bien es `just check` en la máquina de quien lo escribe — el hook
# de commit ya lo corre. El push a main tampoco lo necesita: el release comprueba
# antes de tagear, y si este mismo árbol ya pasó aquí, no lo repite.
on:
  pull_request:
    branches: [main]

# Una corrida por PR; la nueva reemplaza a la que quedó vieja. En un runner
# alojado cada trabajo es una VM limpia, así que ya no hay disco que compartir
# con `release` ni motivo para serializarse con él.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

# `contents: write` sólo para dejar la marca de «este árbol pasó» (ver abajo).
permissions:
  contents: write

jobs:
  check:
    # Alojado: el repositorio es público, así que no cuesta minutos, y no
    # depende de que ninguna máquina de casa esté encendida (deploy/CI.md).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # El historial entero: `scripts/build.sh` sella la versión con
          # `git describe`, y un clon superficial no tiene tags que describir.
          fetch-depth: 0

      # Idempotente por CONTENIDO: el árbol del commit, no el commit. Un re-run,
      # o el merge a main de un PR cuya base no se movió, tienen el mismo árbol
      # que algo que ya pasó, y comprobarlo otra vez no puede dar otra respuesta.
      # La marca es una ref (`refs/ci/check/<árbol>`) y no la caché de Actions,
      # porque la caché de un PR no la puede leer un push a main.
      - id: seen
        run: scripts/ci-seen.sh

      - uses: actions/setup-go@v5
        if: steps.seen.outputs.hit != '1'
        with:
          go-version-file: go.mod
          cache: true

      # bun para el type-check de la interfaz. `check.sh` se lo salta si no está,
      # y saltárselo aquí sería no comprobarlo en ningún sitio.
      - uses: oven-sh/setup-bun@v2
        if: steps.seen.outputs.hit != '1'
      - if: steps.seen.outputs.hit != '1'
        run: cd frontend && bun install --frozen-lockfile

      - if: steps.seen.outputs.hit != '1'
        run: scripts/check.sh

      # Sólo el CI escribe la marca: lo que pasó en la máquina de alguien no
      # cuenta, o `--no-verify` se saltaría también esta puerta. Un PR desde un
      # fork no tiene permiso de escribir refs, y entonces simplemente no deja
      # marca.
      - if: steps.seen.outputs.hit != '1'
        continue-on-error: true
        run: git push origin "HEAD:${{ steps.seen.outputs.ref }}"
