name: deploy-ayetec

# Push to main → the ayetec VPS's self-hosted runner rebuilds and reloads the
# public instance at https://bubble.ayetec.space.
#
# Deliberately separate from deploy.yml rather than another job inside it. The
# two targets are independent systems, and ayetec is the one reachable from
# anywhere; hanging its deploys off a test job pinned to a Mac mini on a LAN
# would let an unreachable box block them.
#
# Only `push` and `workflow_dispatch` — never `pull_request`. The runner
# executes as a user with passwordless sudo, so anything that runs here runs as
# root on the host. Push access to main is the trust boundary, and a
# pull_request trigger would hand that boundary to anyone who can open a PR.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]   # docs-only changes don't need a rebuild/reload
  workflow_dispatch: {}

# One deploy at a time; let an in-flight deploy finish rather than cancelling it.
concurrency:
  group: deploy-ayetec-bubble-work
  cancel-in-progress: false

jobs:
  # Same gate as the reko pipeline: the suite encodes invariants that are not
  # obvious from reading the code, so a regression here is exactly the kind that
  # would otherwise reach the server and be found days later as odd behaviour.
  test:
    runs-on: [self-hosted, ayetec, bubble-work]
    steps:
      - uses: actions/checkout@v4

      - name: gofmt
        run: |
          unformatted="$(gofmt -l ./cmd ./internal)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed on:"; echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: sudo /opt/bubble-work/build-scope.sh go vet ./...

      # Compiling the test binaries is as memory-hungry as building the server,
      # and this host also runs Plane and its databases on two cores. Both steps
      # therefore go through the same cgroup wrapper the deploy uses: overshoot
      # kills the compiler instead of letting the kernel pick a victim.
      - name: go test
        run: sudo /opt/bubble-work/build-scope.sh go test ./...

      # The built bundle (web/dist) is committed, so neither the Go build nor
      # the deploy needs a JS toolchain — this catches type errors before they
      # ship rather than producing anything. bun comes from the `bun` role.
      - name: svelte-check
        run: |
          if ! command -v bun >/dev/null 2>&1; then
            echo "::warning title=Frontend check skipped::bun is not on PATH for this runner, so svelte-check did not run. Go tests still gated this deploy."
            exit 0
          fi
          cd frontend
          bun install --frozen-lockfile
          bunx svelte-check --fail-on-warnings

  deploy:
    needs: test
    runs-on: [self-hosted, ayetec, bubble-work]
    steps:
      # Builds from /opt/bubble-work/src, not from this workspace: keeping the
      # deployed checkout on the box is what makes `git checkout <sha> && sudo
      # deploy.sh` a complete rollback without GitHub in the loop.
      - name: Deploy bubble-work
        run: sudo /opt/bubble-work/deploy.sh

      - name: Verify the public endpoint
        run: |
          revision="$(curl -sf --max-time 10 https://bubble.ayetec.space/health | sed -n 's/.*"revision":"\([^"]*\)".*/\1/p')"
          echo "deployed revision: ${revision:-unknown}"
