name: deploy

# Push to main → the reko Mac mini's self-hosted runner rebuilds and reloads the
# service via the shared services-platform deploy script. See DEPLOY.md.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]   # docs-only changes don't need a rebuild/reload
  workflow_dispatch: {}

# One deploy at a time; let an in-flight deploy finish rather than cancelling it.
concurrency:
  group: deploy-angel-bubble-work
  cancel-in-progress: false

jobs:
  # Gate the deploy on the suite. The tests encode invariants that are not
  # obvious from reading the code — WAL concurrency, the sync watermark coming
  # from data rather than the clock, a partial pass never pruning — so a
  # regression here is exactly the kind that would otherwise reach the server and
  # be discovered as strange behaviour days later.
  test:
    runs-on: [self-hosted, reko, services]
    steps:
      - uses: actions/checkout@v4

      - name: gofmt
        run: |
          unformatted="$(gofmt -l ./cmd ./internal)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed on:"; echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      # The built bundle (web/dist) is committed, so the Go build needs no JS
      # toolchain and neither does the deploy — this check is about catching type
      # errors before they ship, not about producing anything.
      #
      # The frontend uses bun (frontend/bun.lock). npm is NOT a substitute: there
      # is no package-lock.json, so `npm install` would resolve unpinned versions
      # and could pass or fail for reasons unrelated to the commit. Rather than
      # gate deploys on that, this step turns itself on when bun is available and
      # says loudly when it is not.
      - name: svelte-check
        run: |
          if ! command -v bun >/dev/null 2>&1; then
            echo "::warning title=Frontend check skipped::bun is not installed on this runner, so svelte-check did not run. Go tests still gated this deploy. Install bun on the runner to enable it."
            exit 0
          fi
          cd frontend
          bun install --frozen-lockfile
          bunx svelte-check --fail-on-warnings

  deploy:
    needs: test
    runs-on: [self-hosted, reko, services]
    steps:
      - name: Deploy angel-bubble-work
        run: /Users/reko/dev/_infra/bin/deploy-service angel-bubble-work
