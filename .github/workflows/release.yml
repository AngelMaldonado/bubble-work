# Publicar. Nadie decide un número a mano y nadie escribe un changelog dos veces.
#
# Al empujar a main: se comprueba, se calcula la versión desde los Conventional
# Commits, se tagea, se escriben las notas desde esos mismos commits, y se suben
# DOS cosas — los binarios y la imagen. Si no hay nada publicable —sólo `docs:` o
# `chore:`— no pasa nada, a propósito: una versión que no cambia nada enseña a la
# gente a ignorar las versiones.
name: release

on:
  push:
    branches: [main]

# Un release a la vez. Dos ejecuciones a la vez calcularían el mismo número
# siguiente y la segunda pisaría el tag de la primera.
concurrency:
  group: bubble-work-release
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  release:
    # Alojado, como el `check` (deploy/CI.md): publicar no depende de que
    # ninguna máquina de casa esté encendida.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Go siempre: los binarios del release se compilan aquí.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # La misma puerta que un commit local. Publicar sin comprobar es confiar en
      # que la rama que se mezcló es la que se probó — salvo que ESTE árbol ya
      # pasó en el CI, que es lo normal tras mergear un PR cuya base no se movió.
      - id: seen
        run: scripts/ci-seen.sh
      - uses: oven-sh/setup-bun@v2
        if: steps.seen.outputs.hit != '1'
      - if: steps.seen.outputs.hit != '1'
        run: cd frontend && bun install --frozen-lockfile
      - if: steps.seen.outputs.hit != '1'
        run: scripts/check.sh
      - if: steps.seen.outputs.hit != '1'
        continue-on-error: true
        run: git push origin "HEAD:${{ steps.seen.outputs.ref }}"

      # Qué versión toca, y si un intento anterior se quedó a medias.
      #
      # Tagear y publicar son dos pasos, así que hay un hueco entre ellos: la
      # primera vez que esto corrió en la VM, el tag se empujó y `gh release`
      # murió a continuación —`gh` no estaba instalado—, dejando un tag sin
      # release y un reintento que no publicaba nada, porque desde ese tag ya no
      # hay nada nuevo que contar. Ahora se mira: si HEAD lleva un tag sin
      # release, lo que toca es terminar ESE.
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          next="$(scripts/version.sh)"
          resume=
          if [[ -z "$next" ]]; then
            at="$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)"
            if [[ -n "$at" ]] && ! gh release view "$at" >/dev/null 2>&1; then
              echo "$at está tageada y sin release: terminando lo que quedó a medias"
              next="$at"; resume=1
            fi
          fi
          echo "next=$next"     >> "$GITHUB_OUTPUT"
          echo "resume=$resume" >> "$GITHUB_OUTPUT"
          if [[ -z "$next" ]]; then echo "nada que publicar"; fi

      # Al retomar, el rango se cuenta desde el tag ANTERIOR: el de HEAD es el
      # que se está publicando, y medir desde él daría unas notas vacías.
      - name: notas
        if: steps.version.outputs.next != ''
        run: |
          from=
          if [[ -n "${{ steps.version.outputs.resume }}" ]]; then
            from="$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' \
                    "${{ steps.version.outputs.next }}^" 2>/dev/null || true)"
          fi
          scripts/notes.sh $from > /tmp/notes.md

      - name: tag
        if: steps.version.outputs.next != '' && steps.version.outputs.resume == ''
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.next }}" -F /tmp/notes.md
          git push origin "${{ steps.version.outputs.next }}"

      # Los binarios que sirven para actualizar SIN docker. Linux es lo que corre
      # en un VPS; macOS arm64 para trabajar en local contra datos de verdad.
      - name: binarios
        if: steps.version.outputs.next != ''
        run: |
          mkdir -p dist/release
          for pair in linux/amd64 linux/arm64 darwin/arm64; do
            os="${pair%/*}"; arch="${pair#*/}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags "-X main.version=${{ steps.version.outputs.next }}" \
              -o "dist/release/bubble-$os-$arch" .
          done
          # Las sumas viajan con los archivos: un actualizador que baja un
          # binario y lo ejecuta sin comprobarlo confía en la red.
          (cd dist/release && sha256sum bubble-* > SHA256SUMS)

      - name: release
        if: steps.version.outputs.next != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.next }}" \
            --title "${{ steps.version.outputs.next }}" \
            --notes-file /tmp/notes.md \
            dist/release/*

      # QEMU sólo para los `RUN` de la etapa final en arm64 (`apk add`): Go se
      # compila CRUZADO (`--platform=$BUILDPLATFORM`, `GOARCH=$TARGETARCH`), así
      # que lo lento no se emula.
      - uses: docker/setup-qemu-action@v3
        if: steps.version.outputs.next != ''
      - uses: docker/setup-buildx-action@v3
        if: steps.version.outputs.next != ''
      - uses: docker/login-action@v3
        if: steps.version.outputs.next != ''
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # `:stable` es el CANAL — lo que sigue una instancia que no quiere pensar—
      # y el tag con número es para congelar una. Las dos etiquetas apuntan a la
      # misma imagen; elegir cuál seguir es una línea en el .env de la instancia.
      - uses: docker/build-push-action@v6
        if: steps.version.outputs.next != ''
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.version.outputs.next }}
          # En minúsculas y escrito a mano: el dueño del repositorio es
          # `AngelMaldonado` y GHCR sólo acepta nombres en minúscula, así que
          # `${{ github.repository_owner }}` aquí falla al empujar.
          tags: |
            ghcr.io/angelmaldonado/bubble-work:${{ steps.version.outputs.next }}
            ghcr.io/angelmaldonado/bubble-work:stable
          # Caché de GitHub Actions: en un runner efímero es la única forma de no
          # reconstruir desde cero. `ignore-error` porque exportarla ya falló una
          # vez DESPUÉS de haber publicado («results-receiver … unexpected EOF»),
          # y un trabajo en rojo que sí publicó enseña a desconfiar del color en
          # vez de del fallo.
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true
