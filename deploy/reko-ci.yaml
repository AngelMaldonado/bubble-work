# La máquina de CI de reko. UNA para todos los repos, no una por proyecto.
#
#   limactl start --name=reko-ci deploy/reko-ci.yaml
#
# Se llama por la MÁQUINA y no por el proyecto que la estrenó: dentro de un año
# sería una VM con el nombre de uno de los cinco software que corre, y nadie
# sabría si se puede tocar. Aquí no hay nada de Bubble Work.
#
# Ésta es la receta para REHACERLA. La que está corriendo se levantó a mano
# desde la plantilla de Ubuntu de lima; lo que sigue es esa misma forma escrita,
# para que borrarla y rehacerla no dependa de que alguien se acuerde.
vmType: vz
arch: aarch64
# aarch64 NATIVA, no x86_64 emulada. Lo que esta VM aporta es la semántica de
# Linux —bash 5, coreutils de GNU—, y eso no depende de la arquitectura: los
# binarios de amd64 los cross-compila Go, y la imagen de docker se construye
# cruzada (`--platform=$BUILDPLATFORM`). Emular sería pagar minutos por nada.

images:
  - location: "https://cloud-images.ubuntu.com/releases/resolute/release/ubuntu-26.04-server-cloudimg-arm64.img"
    arch: aarch64

cpus: 4
memory: "4GiB"
disk: "100GiB"

# NADA del host montado. El CI ejecuta código de la rama que se propone en un
# PR; que no pueda ver el disco de nadie es la mitad de por qué vive en una VM.
# La plantilla por defecto de lima monta `~`, y eso hay que quitarlo.
mounts: []

provision:
  - mode: system
    script: |
      #!/bin/bash
      set -eux
      apt-get update
      # git de verdad: el árbol de markdown se escribe llamando al programa, que
      # es el mismo con el que una persona clona y lee.
      # python3, curl y jq los usa scripts/test.sh.
      apt-get install -y git curl ca-certificates python3 jq
      # docker desde el repo oficial y no el de la distribución: éste trae el
      # plugin buildx, y sin buildx no hay imagen multiarco.
      curl -fsSL https://get.docker.com | sh
      # El agente NO corre como root — `config.sh` se niega, y con razón.
      id runner >/dev/null 2>&1 || useradd -m -s /bin/bash runner
      usermod -aG docker runner
      systemctl enable --now docker

# Go y bun NO se instalan aquí: `setup-go` y `setup-bun` los bajan en la primera
# corrida y quedan en la caché del runner. Fijarlos en la imagen sería una
# segunda versión que mantener, y la que manda es la de `go.mod`.
